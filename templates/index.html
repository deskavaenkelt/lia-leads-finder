<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIA Leads Finder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <div class="page-header">
      <div>
        <h1>LIA Leads Finder</h1>
        <p class="subtitle">Hitta LIA-företag som matchar din tech stack</p>
      </div>
      <a href="/profile" class="btn-profile">Min profil</a>
    </div>
    <form method="post" action="/search" class="search-form">
      <label for="city">Stad</label>
      <div class="city-row">
        <input type="text" id="city" name="city" placeholder="t.ex. Göteborg">
        <select id="radius_km" name="radius_km" title="Sökradie">
          <option value="0">Endast stan</option>
          <option value="25">+25 km</option>
          <option value="50">+50 km</option>
          <option value="80">+80 km</option>
          <option value="150">+150 km</option>
        </select>
      </div>

      <label for="tech_stack">Tech stack <small>(kommaseparerat)</small></label>
      <input type="text" id="tech_stack" name="tech_stack" placeholder="t.ex. Java, Spring Boot"
             value="{{ student.tech_stack | join(', ') if student and student.tech_stack else '' }}">

      <label for="program_url">Programsida URL <small>(valfri)</small></label>
      <input type="url" id="program_url" name="program_url" placeholder="t.ex. https://www.yh-skolan.se/program/systemutvecklare">
      <small class="hint">Om URL anges och tech-stack lämnas tom fylls den i automatiskt.</small>

      <label class="checkbox-label">
        <input type="checkbox" name="all_sweden" id="all_sweden" onchange="toggleCity(this)"> Sök i hela Sverige
      </label>

      <button type="submit" id="submit-btn">
        <span id="btn-text">Hitta LIA-företag</span>
        <span id="btn-spinner" hidden>
          <svg class="spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-dashoffset="10"/>
          </svg>
          Söker…
        </span>
      </button>
    </form>
  </main>
  <script>
    function toggleCity(cb) {
      const cityInput = document.getElementById('city');
      cityInput.disabled = cb.checked;
      cityInput.placeholder = cb.checked ? 'Hela Sverige' : 't.ex. Göteborg';
    }

    const SEARCH_SETTINGS_KEY = 'lia-search-settings';

    function saveSearchSettings() {
      try {
        localStorage.setItem(SEARCH_SETTINGS_KEY, JSON.stringify({
          city: document.getElementById('city').value,
          radius_km: document.getElementById('radius_km').value,
          tech_stack: document.getElementById('tech_stack').value,
          program_url: document.getElementById('program_url').value,
          all_sweden: document.getElementById('all_sweden').checked,
        }));
      } catch (e) { /* localStorage unavailable (private mode, blocked, ...) — skip saving */ }
    }

    function restoreSearchSettings() {
      try {
        const raw = localStorage.getItem(SEARCH_SETTINGS_KEY);
        if (!raw) return;
        const settings = JSON.parse(raw);

        if (settings.city) document.getElementById('city').value = settings.city;
        if (settings.radius_km) document.getElementById('radius_km').value = settings.radius_km;
        if (settings.tech_stack) document.getElementById('tech_stack').value = settings.tech_stack;
        if (settings.program_url) document.getElementById('program_url').value = settings.program_url;
        if (settings.all_sweden) {
          const allSwedenBox = document.getElementById('all_sweden');
          allSwedenBox.checked = true;
          toggleCity(allSwedenBox);
        }
      } catch (e) { /* malformed or unavailable storage — start from server defaults */ }
    }

    restoreSearchSettings();

    document.querySelector('.search-form').addEventListener('submit', function() {
      saveSearchSettings();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      document.getElementById('btn-text').hidden = true;
      document.getElementById('btn-spinner').hidden = false;
    });

    // Navigating back (e.g. a mobile swipe-back) can restore this page from
    // the browser's bfcache with the button still stuck in its "searching…"
    // state from before — reset it whenever the page becomes visible again.
    window.addEventListener('pageshow', function() {
      const btn = document.getElementById('submit-btn');
      btn.disabled = false;
      document.getElementById('btn-text').hidden = false;
      document.getElementById('btn-spinner').hidden = true;
    });
  </script>
</body>
</html>
